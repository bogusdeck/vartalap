[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vartalap"
version = "0.1.0"
description = "Autonomous Reddit DM conversation service"
readme = "README.md"
authors = [{ name = "Vartalap Developers" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "playwright>=1.40.0",
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0"
]

[project.scripts]
vartalap = "vartalap.cli:main"
vartalap-login = "vartalap.login:main"
